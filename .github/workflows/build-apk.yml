
name: Build LaboManager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LaboManager_WebPourAPK_JEFFELI.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q LaboManager_WebPourAPK_JEFFELI.zip -d extracted

      - name: Locate Android project
        id: project
        run: |
          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LaboManager-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

