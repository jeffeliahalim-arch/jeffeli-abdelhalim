
name: Inspecter le ZIP LaboManager

on:
  workflow_dispatch:

jobs:
  inspecter:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Afficher les fichiers du depot
        run: |
          echo "=== Fichiers du depot ==="
          ls -lah
          echo "=== Recherche de l'archive ==="
          find . -type f -iname "*.zip" -print

      - name: Examiner le contenu du ZIP
        run: |
          ZIP="$(find . -type f -iname 'LaboManager_WebPourAPK_JEFFELI.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERREUR : archive introuvable"
            exit 1
          fi

          echo "=== Archive trouvee : $ZIP ==="
          unzip -l "$ZIP"

          echo "=== Extraction ==="
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "=== Liste des fichiers extraits ==="
          find extracted -maxdepth 6 -type f -print

          echo "=== Recherche des fichiers Gradle ==="
          find extracted -type f \
            \( -iname 'gradlew' \
            -o -iname 'gradlew.bat' \
            -o -iname 'gradle-wrapper.jar' \
            -o -iname 'gradle-wrapper.properties' \
            -o -iname 'settings.gradle' \
            -o -iname 'settings.gradle.kts' \
            -o -iname 'build.gradle' \
            -o -iname 'build.gradle.kts' \) -print
